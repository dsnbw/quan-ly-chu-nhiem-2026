<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1a103c" />
    </linearGradient>
    <linearGradient id="bubbleAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1100" height="620" rx="14" fill="url(#aiBg)" stroke="#6366f1" stroke-width="1.5" />

  <!-- App Header -->
  <g transform="translate(36, 30)">
    <rect width="1028" height="60" rx="10" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
    <circle cx="36" cy="30" r="18" fill="#818cf8" fill-opacity="0.2" />
    <text x="26" y="36" fill="#c084fc" font-size="20">✨</text>
    <text x="68" y="26" fill="#ffffff" font-size="16" font-weight="800">TRỢ LÝ AI CHỦ NHIỆM GIÁO DỤC (AI HOMEROOM COPILOT)</text>
    <text x="68" y="46" fill="#c7d2fe" font-size="12">Tích hợp Google Gemini 1.5 Pro &amp; OpenAI • Sinh nhận xét học bạ chuẩn TT 22/TT 27 • Cố vấn kỷ luật tích cực TT 18</text>
    
    <!-- Model Selector Badge -->
    <g transform="translate(810, 14)">
      <rect width="195" height="32" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="28" y="20" fill="#e0e7ff" font-size="11" font-weight="700">Model: Gemini 1.5 Pro</text>
    </g>
  </g>

  <!-- Left: Prompt Presets & Educational Tools -->
  <g transform="translate(36, 105)">
    <rect width="320" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="32" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">BỘ KỊCH BẢN CHUYÊN BIỆT GVCN</text>

    <!-- Preset 1 -->
    <g transform="translate(16, 50)">
      <rect width="288" height="62" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">📝 Nhận xét học bạ tự động</text>
      <text x="14" y="44" fill="#a5b4fc" font-size="10">Chuẩn hóa văn phong TT 22 &amp; TT 27 theo năng lực</text>
    </g>

    <!-- Preset 2 -->
    <g transform="translate(16, 122)">
      <rect width="288" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">💡 Kỷ luật tích cực (TT 18/2025)</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">Gợi ý can thiệp sư phạm học sinh vi phạm</text>
    </g>

    <!-- Preset 3 -->
    <g transform="translate(16, 194)">
      <rect width="288" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">✉️ Thư trao đổi với Phụ huynh</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">Soạn tin nhắn khéo léo, đồng hành cùng gia đình</text>
    </g>

    <!-- Preset 4 -->
    <g transform="translate(16, 266)">
      <rect width="288" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">📋 Kế hoạch sinh hoạt lớp</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">Thiết kế chủ đề sinh hoạt 15 phút &amp; tiết cuối tuần</text>
    </g>

    <g transform="translate(16, 340)">
      <rect width="288" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" fill="#fbbf24" font-size="11" font-weight="700">🔒 BẢO MẬT &amp; ĐẠO ĐỨC AI</text>
      <text x="14" y="48" fill="#cbd5e1" font-size="10">Dữ liệu họ tên thật của học sinh được tự động ẩn danh hóa trước khi gửi API, tuân thủ Nghị định 13/2023/NĐ-CP.</text>
      <text x="14" y="90" fill="#34d399" font-size="10" font-weight="600">✓ AI chỉ đóng vai trò trợ lý gợi ý</text>
      <text x="14" y="106" fill="#34d399" font-size="10" font-weight="600">✓ Thầy cô toàn quyền duyệt &amp; ký</text>
    </g>
  </g>

  <!-- Right: Active Chat Conversation -->
  <g transform="translate(376, 105)">
    <rect width="688" height="480" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />

    <!-- Message 1: User Request -->
    <g transform="translate(30, 20)">
      <rect width="628" height="64" rx="8" fill="url(#bubbleUser)" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" fill="#38bdf8" font-size="11" font-weight="700">🧑‍🏫 Thầy Minh (Giáo viên chủ nhiệm):</text>
      <text x="16" y="44" fill="#f8fafc" font-size="12">"Sinh giúp tôi nhận xét học bạ cuối năm cho em Nguyễn Văn An (ĐTB Toán 9.3, ĐTB chung 8.83 - Xuất sắc, Lớp trưởng, rất nhiệt tình giúp bạn nhưng đôi khi còn áp lực vì thành tích). Chuẩn TT 22."</text>
    </g>

    <!-- Message 2: AI Response -->
    <g transform="translate(30, 98)">
      <rect width="628" height="290" rx="8" fill="url(#bubbleAi)" stroke="#6366f1" stroke-width="1" />
      <circle cx="28" cy="24" r="10" fill="#818cf8" fill-opacity="0.3" />
      <text x="21" y="28" fill="#c084fc" font-size="12">🤖</text>
      <text x="46" y="28" fill="#c084fc" font-size="12" font-weight="800">Trợ Lý AI Chủ Nhiệm 2026:</text>
      <text x="16" y="56" fill="#e2e8f0" font-size="11">Dạ Thầy Minh, dưới đây là bản nhận xét học bạ chuẩn hóa theo Thông tư 22/2021/TT-BGDĐT:</text>

      <!-- Inner Suggestion Box -->
      <rect x="16" y="72" width="596" height="135" rx="6" fill="#090d16" stroke="#4f46e5" stroke-width="1" />
      
      <text x="14" y="26" fill="#a5b4fc" font-size="11" font-weight="700">ĐỀ XUẤT NHẬN XÉT HỌC BẠ SỐ (MẪU 1):</text>
      <text x="14" y="48" fill="#ffffff" font-size="11">"Học sinh có năng lực tự học xuất sắc, tư duy logic và giải quyết vấn đề vượt trội đặc biệt ở môn Toán học. Luôn gương mẫu, trách nhiệm cao trong vai trò Lớp trưởng và tích cực hỗ trợ bạn bè cùng tiến bộ."</text>
      
      <text x="14" y="86" fill="#a5b4fc" font-size="11" font-weight="700">LỜI KHUYÊN PHÁT TRIỂN &amp; RÈN LUYỆN:</text>
      <text x="14" y="104" fill="#ffffff" font-size="11">"Nên chú ý cân đối giữa việc học tập và tham gia các hoạt động giải trí thể thao để giữ tinh thần thoải mái, phát huy tối đa tiềm năng bản thân."</text>

      <!-- AI Action Buttons -->
      <g transform="translate(16, 222)">
        <rect width="180" height="34" rx="6" fill="#4338ca" />
        <text x="90" y="22" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓ Chèn trực tiếp vào Học bạ</text>

        <rect x="190" width="130" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="255" y="22" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Tái tạo phương án 2</text>

        <rect x="330" width="110" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="385" y="22" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Sao chép văn bản</text>
      </g>
    </g>

    <!-- Bottom Chat Input Bar -->
    <g transform="translate(30, 412)">
      <rect width="628" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="20" y="28" fill="#64748b" font-size="12">Nhập yêu cầu cho AI (ví dụ: Soạn tin nhắn gửi mẹ An nhắc giữ gìn sức khỏe cho con)...</text>
      <rect x="548" y="8" width="68" height="30" rx="6" fill="#2563eb" />
      <text x="582" y="27" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Gửi ↵</text>
    </g>
  </g>
</svg>
