<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" style="border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="460" rx="16" fill="url(#bgGradient)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="180" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="380" r="160" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

  <!-- Tech Grid Background -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200 M0,360 H1200 M0,420 H1200" />
    <path d="M100,0 V460 M200,0 V460 M300,0 V460 M400,0 V460 M500,0 V460 M600,0 V460 M700,0 V460 M800,0 V460 M900,0 V460 M1000,0 V460 M1100,0 V460" />
  </g>

  <!-- Header Category Badge -->
  <g transform="translate(60, 42)">
    <rect width="360" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#10b981" />
    <text x="32" y="20" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">BỘ GIÁO DỤC VÀ ĐÀO TẠO • TIÊU CHUẨN 2026</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="118" fill="url(#primaryGlow)" font-size="44" font-weight="900" letter-spacing="-0.5">
    QUẢN LÝ CHỦ NHIỆM 2026
  </text>
  <text x="60" y="152" fill="#f8fafc" font-size="20" font-weight="600">
    Hệ thống Toàn diện Công tác Chủ nhiệm Lớp, Học bạ số Quốc gia &amp; Phối hợp Giáo dục
  </text>
  <text x="60" y="180" fill="#94a3b8" font-size="14" font-weight="400">
    Chuẩn hóa theo Thông tư 15/2026, 70/2026, 22/2021, 27/2020, 55/2011 &amp; Nghị định 13/2023/NĐ-CP
  </text>

  <!-- Standard Badges -->
  <g transform="translate(60, 206)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="28" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="18" fill="#e0f2fe" font-size="11" font-weight="600">⚡ Offline-First</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(142, 0)">
      <rect width="148" height="28" rx="6" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1" />
      <text x="12" y="18" fill="#e0e7ff" font-size="11" font-weight="600">📜 Học bạ số TT 70</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(302, 0)">
      <rect width="144" height="28" rx="6" fill="#047857" fill-opacity="0.3" stroke="#34d399" stroke-width="1" />
      <text x="12" y="18" fill="#d1fae5" font-size="11" font-weight="600">💰 Quỹ lớp TT 55</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(458, 0)">
      <rect width="140" height="28" rx="6" fill="#b45309" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1" />
      <text x="12" y="18" fill="#fef3c7" font-size="11" font-weight="600">⚖️ Điều lệ TT 15</text>
    </g>
    <!-- Badge 5 -->
    <g transform="translate(610, 0)">
      <rect width="150" height="28" rx="6" fill="#7e22ce" fill-opacity="0.3" stroke="#c084fc" stroke-width="1" />
      <text x="12" y="18" fill="#f3e8ff" font-size="11" font-weight="600">🤖 Trợ lý AI Sư phạm</text>
    </g>
  </g>

  <!-- 3 Interactive Metric Preview Cards -->
  <g transform="translate(60, 260)" filter="url(#shadow)">
    <!-- Card 1: Attendance & Class roster -->
    <g transform="translate(0, 0)">
      <rect width="345" height="150" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
      <circle cx="36" cy="36" r="18" fill="#0284c7" fill-opacity="0.25" />
      <text x="27" y="42" fill="#38bdf8" font-size="18">👥</text>
      <text x="66" y="32" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase">Sĩ số &amp; Chuyên cần</text>
      <text x="66" y="52" fill="#f8fafc" font-size="20" font-weight="800">42/42 Học sinh</text>
      
      <rect x="24" y="74" width="297" height="6" rx="3" fill="#334155" />
      <rect x="24" y="74" width="288" height="6" rx="3" fill="#10b981" />
      
      <text x="24" y="104" fill="#94a3b8" font-size="12">Hôm nay: <tspan fill="#34d399" font-weight="700">41 Có mặt</tspan> • <tspan fill="#60a5fa">1 Có phép</tspan> • <tspan fill="#f87171">0 Vắng</tspan></text>
      <text x="24" y="128" fill="#64748b" font-size="11">Duyệt đơn nghỉ phép online chuẩn TT 15</text>
    </g>

    <!-- Card 2: Financial Transparency TT 55 -->
    <g transform="translate(365, 0)">
      <rect width="345" height="150" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
      <circle cx="36" cy="36" r="18" fill="#059669" fill-opacity="0.25" />
      <text x="27" y="42" fill="#34d399" font-size="18">💵</text>
      <text x="66" y="32" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase">Quỹ Ban Đại Diện CMHS</text>
      <text x="66" y="52" fill="#34d399" font-size="20" font-weight="800">14.250.000 đ</text>
      
      <g transform="translate(24, 72)">
        <rect width="142" height="26" rx="4" fill="#1e293b" />
        <text x="8" y="18" fill="#94a3b8" font-size="11">Thu: <tspan fill="#38bdf8" font-weight="700">25.200.000 đ</tspan></text>
        <rect x="150" width="147" height="26" rx="4" fill="#1e293b" />
        <text x="158" y="18" fill="#94a3b8" font-size="11">Chi: <tspan fill="#f87171" font-weight="700">10.950.000 đ</tspan></text>
      </g>
      
      <text x="24" y="124" fill="#10b981" font-size="12" font-weight="600">✓ Kiểm toán kép • Đảo giao dịch an toàn</text>
      <text x="24" y="139" fill="#64748b" font-size="10">Tuân thủ nghiêm ngặt Thông tư 55/2011/TT-BGDĐT</text>
    </g>

    <!-- Card 3: Digital Report Card TT 70 -->
    <g transform="translate(730, 0)">
      <rect width="350" height="150" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
      <circle cx="36" cy="36" r="18" fill="#7c3aed" fill-opacity="0.25" />
      <text x="27" y="42" fill="#c084fc" font-size="18">🛡️</text>
      <text x="66" y="32" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase">Học Bạ Số TT 70/2026</text>
      <text x="66" y="52" fill="#f8fafc" font-size="20" font-weight="800">Đã Ký Số 42/42</text>
      
      <g transform="translate(24, 72)">
        <rect width="302" height="26" rx="4" fill="#312e81" fill-opacity="0.4" stroke="#4338ca" stroke-width="1" />
        <circle cx="16" cy="13" r="4" fill="#34d399" />
        <text x="28" y="17" fill="#e0e7ff" font-size="11" font-weight="600">Chữ ký số PKI + Mã QR Xác Thực</text>
      </g>

      <text x="24" y="124" fill="#94a3b8" font-size="12">Quy trình 5 bước phát hành • BGH duyệt số</text>
      <text x="24" y="139" fill="#64748b" font-size="10">Lưu trữ điện tử vĩnh viễn theo TT 08/2025</text>
    </g>
  </g>

  <!-- Platforms Supported Badge bottom right -->
  <g transform="translate(850, 48)">
    <rect width="290" height="34" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="14" y="22" fill="#cbd5e1" font-size="11" font-weight="600">
      💻 Windows • 📱 Android • 🌐 Web Cloud
    </text>
  </g>
</svg>
