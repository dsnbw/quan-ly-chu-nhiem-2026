<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1a103c" />
    </linearGradient>
    <linearGradient id="bubbleAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" rx="14" fill="url(#aiBg)" stroke="#6366f1" stroke-width="1.5" />

  <!-- App Header -->
  <g transform="translate(36, 26)">
    <rect width="1028" height="62" rx="10" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
    <circle cx="36" cy="31" r="18" fill="#818cf8" fill-opacity="0.2" />
    <text x="26" y="37" fill="#c084fc" font-size="20">✨</text>
    <text x="68" y="27" fill="#ffffff" font-size="15" font-weight="800">TRỢ LÝ AI CHỦ NHIỆM GIÁO DỤC (AI HOMEROOM COPILOT)</text>
    <text x="68" y="47" fill="#c7d2fe" font-size="11">Tích hợp Gemini &amp; OpenAI • Sinh nhận xét học bạ TT 22/TT 27 • Cố vấn kỷ luật TT 18</text>
    
    <!-- Model Selector Badge -->
    <g transform="translate(820, 15)">
      <rect width="185" height="32" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="28" y="20" fill="#e0e7ff" font-size="11" font-weight="700">Model: Gemini 1.5 Pro</text>
    </g>
  </g>

  <!-- Left: Prompt Presets & Educational Tools -->
  <g transform="translate(36, 102)">
    <rect width="320" height="550" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">BỘ KỊCH BẢN CHUYÊN BIỆT GVCN</text>

    <!-- Preset 1 -->
    <g transform="translate(16, 46)">
      <rect width="288" height="62" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">📝 Nhận xét học bạ tự động</text>
      <text x="14" y="44" fill="#a5b4fc" font-size="10">Chuẩn hóa văn phong TT 22 &amp; TT 27 theo năng lực</text>
    </g>

    <!-- Preset 2 -->
    <g transform="translate(16, 118)">
      <rect width="288" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">💡 Kỷ luật tích cực (TT 18/2025)</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">Gợi ý can thiệp sư phạm học sinh vi phạm</text>
    </g>

    <!-- Preset 3 -->
    <g transform="translate(16, 190)">
      <rect width="288" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">✉️ Thư trao đổi với Phụ huynh</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">Soạn tin nhắn khéo léo, đồng hành cùng gia đình</text>
    </g>

    <!-- Preset 4 -->
    <g transform="translate(16, 262)">
      <rect width="288" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="700">📋 Kế hoạch sinh hoạt lớp</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10">Thiết kế chủ đề sinh hoạt 15 phút &amp; tiết cuối tuần</text>
    </g>

    <!-- Policy Box with multi-line wrapped text -->
    <g transform="translate(16, 336)">
      <rect width="288" height="194" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" fill="#fbbf24" font-size="11" font-weight="700">🔒 BẢO MẬT &amp; ĐẠO ĐỨC AI</text>
      
      <text x="14" y="48" fill="#cbd5e1" font-size="10">
        <tspan x="14" dy="0">Dữ liệu họ tên thật của học sinh được</tspan>
        <tspan x="14" dy="16">tự động ẩn danh hóa trước khi gửi API,</tspan>
        <tspan x="14" dy="16">bảo đảm tuân thủ Nghị định 13/2023/NĐ-CP.</tspan>
      </text>

      <rect x="14" y="106" width="260" height="1" fill="#334155" />

      <text x="14" y="128" fill="#34d399" font-size="10" font-weight="600">
        <tspan x="14" dy="0">✓ AI chỉ đóng vai trò trợ lý gợi ý (Draft)</tspan>
        <tspan x="14" dy="18">✓ Thầy cô toàn quyền chỉnh sửa và duyệt</tspan>
        <tspan x="14" dy="18">✓ Không lưu trữ dữ liệu cá nhân trên đám mây</tspan>
      </text>
    </g>
  </g>

  <!-- Right: Active Chat Conversation -->
  <g transform="translate(376, 102)">
    <rect width="688" height="550" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />

    <!-- Message 1: User Request (Height 85) -->
    <g transform="translate(24, 18)">
      <rect width="640" height="84" rx="8" fill="url(#bubbleUser)" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" fill="#38bdf8" font-size="11" font-weight="700">🧑‍🏫 Thầy Nguyễn Văn Minh (Giáo viên chủ nhiệm):</text>
      <text x="16" y="42" fill="#f8fafc" font-size="11">
        <tspan x="16" dy="0">"Sinh giúp tôi nhận xét học bạ cuối năm cho em Nguyễn Văn An (ĐTB Toán 9.3,</tspan>
        <tspan x="16" dy="17">ĐTB chung 8.83 - Xuất sắc, Lớp trưởng, rất nhiệt tình giúp đỡ bạn bè cùng tiến bộ</tspan>
        <tspan x="16" dy="17">nhưng đôi khi còn hơi áp lực về thành tích học tập). Chuẩn Thông tư 22."</tspan>
      </text>
    </g>

    <!-- Message 2: AI Response (Height 360) -->
    <g transform="translate(24, 114)">
      <rect width="640" height="355" rx="8" fill="url(#bubbleAi)" stroke="#6366f1" stroke-width="1" />
      <circle cx="28" cy="24" r="10" fill="#818cf8" fill-opacity="0.3" />
      <text x="21" y="28" fill="#c084fc" font-size="12">🤖</text>
      <text x="46" y="28" fill="#c084fc" font-size="12" font-weight="800">Trợ Lý AI Chủ Nhiệm 2026:</text>
      <text x="16" y="52" fill="#e2e8f0" font-size="11">Dạ Thầy Minh, dưới đây là bản nhận xét học bạ chuẩn hóa theo Thông tư 22/2021/TT-BGDĐT:</text>

      <!-- Inner Suggestion Box 1: Core Comment -->
      <g transform="translate(16, 64)">
        <rect width="608" height="116" rx="6" fill="#090d16" stroke="#4f46e5" stroke-width="1" />
        <text x="14" y="22" fill="#a5b4fc" font-size="11" font-weight="700">ĐỀ XUẤT NHẬN XÉT HỌC BẠ SỐ (MẪU 1):</text>
        <text x="14" y="44" fill="#ffffff" font-size="11">
          <tspan x="14" dy="0">"Học sinh có năng lực tự học xuất sắc, tư duy logic và giải quyết vấn đề vượt trội</tspan>
          <tspan x="14" dy="18">đặc biệt ở môn Toán học. Luôn gương mẫu, trách nhiệm cao trong vai trò Lớp trưởng</tspan>
          <tspan x="14" dy="18">và tích cực hỗ trợ bạn bè cùng tiến bộ."</tspan>
        </text>
      </g>

      <!-- Inner Suggestion Box 2: Development Advice -->
      <g transform="translate(16, 190)">
        <rect width="608" height="96" rx="6" fill="#090d16" stroke="#4f46e5" stroke-width="1" />
        <text x="14" y="22" fill="#a5b4fc" font-size="11" font-weight="700">LỜI KHUYÊN PHÁT TRIỂN &amp; RÈN LUYỆN:</text>
        <text x="14" y="44" fill="#ffffff" font-size="11">
          <tspan x="14" dy="0">"Nên chú ý cân đối giữa việc học tập và tham gia các hoạt động ngoại khóa, thể dục</tspan>
          <tspan x="14" dy="18">thể thao để giữ tinh thần thoải mái, phát huy tối đa tiềm năng bản thân."</tspan>
        </text>
      </g>

      <!-- AI Action Buttons -->
      <g transform="translate(16, 302)">
        <rect width="190" height="34" rx="6" fill="#4338ca" />
        <text x="95" y="22" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓ Chèn trực tiếp vào Học bạ</text>

        <rect x="202" width="135" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="269" y="22" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Tái tạo phương án 2</text>

        <rect x="349" width="125" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="411" y="22" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Sao chép văn bản</text>
      </g>
    </g>

    <!-- Bottom Chat Input Bar -->
    <g transform="translate(24, 482)">
      <rect width="640" height="46" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="28" fill="#64748b" font-size="11">Nhập yêu cầu cho AI (ví dụ: Soạn tin nhắn gửi mẹ An nhắc nhở học sinh)...</text>
      <rect x="560" y="8" width="68" height="30" rx="6" fill="#2563eb" />
      <text x="594" y="27" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Gửi ↵</text>
    </g>
  </g>
</svg>
