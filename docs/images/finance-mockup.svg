      <text x="20" y="30" fill="#f87171" font-size="12" font-weight="700">#PC-2602</text>
      <text x="120" y="30" fill="#cbd5e1" font-size="11">20/01/2026 14:15</text>
      <text x="230" y="30" fill="#f8fafc" font-size="12" font-weight="600">Thăm hỏi học sinh khó khăn</text>
      <text x="440" y="30" fill="#94a3b8" font-size="11">Tặng 03 suất quà Tết động viên học sinh nghèo vượt khó</text>
      <text x="730" y="30" fill="#f87171" font-size="13" font-weight="800">-3.000.000 đ</text>
      <rect x="850" y="14" width="75" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="887" y="30" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle">Có chứng từ</text>
      <text x="975" y="30" fill="#64748b" font-size="11">Xem phiếu</text>
      <line x1="16" y1="52" x2="1012" y2="52" stroke="#334155" stroke-width="0.8" />
    </g>

