    <text x="120" y="24" fill="#94a3b8" font-size="11" font-weight="700">NGÀY GIỜ</text>
    <text x="230" y="24" fill="#94a3b8" font-size="11" font-weight="700">DANH MỤC CHI PHÍ</text>
    <text x="440" y="24" fill="#94a3b8" font-size="11" font-weight="700">NỘI DUNG DIỄN GIẢI</text>
    <text x="730" y="24" fill="#94a3b8" font-size="11" font-weight="700">SỐ TIỀN</text>
    <text x="860" y="24" fill="#94a3b8" font-size="11" font-weight="700">TRẠNG THÁI</text>
    <text x="960" y="24" fill="#94a3b8" font-size="11" font-weight="700">THAO TÁC</text>

