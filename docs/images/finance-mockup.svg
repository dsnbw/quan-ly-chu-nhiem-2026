<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1100" height="620" rx="14" fill="url(#finBg)" stroke="#334155" stroke-width="1.5" />

  <!-- App Header -->
  <g transform="translate(36, 30)">
    <rect width="1028" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="24" y="26" fill="#f8fafc" font-size="16" font-weight="800">SỔ QUỸ LỚP MINH BẠCH • BAN ĐẠI DIỆN CHA MẸ HỌC SINH</text>
    <text x="24" y="46" fill="#94a3b8" font-size="11">Chuẩn Thông tư 55/2011/TT-BGDĐT • Kế toán kép &amp; Đảo giao dịch an toàn (Reversal Audit)</text>
    
    <!-- Action buttons -->
    <g transform="translate(680, 14)">
      <rect width="165" height="32" rx="6" fill="#059669" />
      <text x="82" y="21" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">+ Lập Phiếu Thu / Chi</text>
      
      <rect x="175" width="155" height="32" rx="6" fill="#0284c7" />
      <text x="252" y="21" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">📊 Báo Cáo Công Khai</text>
    </g>
  </g>

  <!-- Legal Notice Warning Bar (TT 55/2011) -->
  <g transform="translate(36, 102)">
    <rect width="1028" height="38" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1" />
    <text x="20" y="24" fill="#fbbf24" font-size="11" font-weight="700">⚖️ QUY ĐỊNH PHÁP LÝ (ĐIỀU 10 - TT 55/2011):</text>
    <text x="310" y="24" fill="#fde68a" font-size="11">Nghiêm cấm quyên góp quỹ CMHS để chi trả bảo vệ, vệ sinh, sửa chữa CSVC hoặc khen thưởng CBGV.</text>
  </g>

  <!-- 4 Stat Summary Cards -->
  <g transform="translate(36, 152)">
    <!-- Total Income -->
    <g transform="translate(0, 0)">
      <rect width="242" height="85" rx="8" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600">TỔNG CÁC KHOẢN THU</text>
      <text x="16" y="54" fill="#38bdf8" font-size="20" font-weight="800">25.200.000 đ</text>
      <text x="16" y="72" fill="#64748b" font-size="10">42/42 Học sinh tự nguyện đóng góp</text>
    </g>

    <!-- Total Expense -->
    <g transform="translate(262, 0)">
      <rect width="242" height="85" rx="8" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="600">TỔNG CÁC KHOẢN CHI</text>
      <text x="16" y="54" fill="#f87171" font-size="20" font-weight="800">10.950.000 đ</text>
      <text x="16" y="72" fill="#64748b" font-size="10">100% Hoạt động học tập &amp; ngoại khóa</text>
