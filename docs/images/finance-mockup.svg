      <text x="120" y="30" fill="#cbd5e1" font-size="11">10/02/2026 09:00</text>
      <text x="230" y="30" fill="#f8fafc" font-size="12" font-weight="600">In ấn tài liệu ôn TN THPT</text>
      <text x="440" y="30" fill="#94a3b8" font-size="11">In tập đề cương ôn thi tốt nghiệp 4 môn thi chính thức</text>
      <text x="730" y="30" fill="#f87171" font-size="13" font-weight="800">-4.200.000 đ</text>
      <rect x="850" y="14" width="75" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="887" y="30" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle">Hóa đơn VAT</text>
      <text x="975" y="30" fill="#64748b" font-size="11">Xem phiếu</text>
      <line x1="16" y1="52" x2="1012" y2="52" stroke="#334155" stroke-width="0.8" />
    </g>

    <!-- Row 4: Chi hoạt động ngoại khóa 26/3 -->
    <g transform="translate(0, 202)">
      <rect width="1028" height="52" fill="#0f172a" fill-opacity="0.5" />
      <text x="20" y="30" fill="#f87171" font-size="12" font-weight="700">#PC-2604</text>
      <text x="120" y="30" fill="#cbd5e1" font-size="11">24/03/2026 15:45</text>
      <text x="230" y="30" fill="#f8fafc" font-size="12" font-weight="600">Hội trại truyền thống 26/3</text>
      <text x="440" y="30" fill="#94a3b8" font-size="11">Nước uống, dụng cụ dựng lều trại và hỗ trợ ăn trưa</text>
      <text x="730" y="30" fill="#f87171" font-size="13" font-weight="800">-3.750.000 đ</text>
      <rect x="850" y="14" width="75" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="887" y="30" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle">Hóa đơn VAT</text>
      <text x="975" y="30" fill="#64748b" font-size="11">Xem phiếu</text>
      <line x1="16" y1="52" x2="1012" y2="52" stroke="#334155" stroke-width="0.8" />
    </g>

    <!-- Row 5: Reversal Transaction Demonstration -->
    <g transform="translate(0, 256)">
      <rect width="1028" height="52" fill="#1e293b" />
      <text x="20" y="30" fill="#94a3b8" font-size="12" font-weight="700" text-decoration="line-through">#PC-2605</text>
      <text x="120" y="30" fill="#64748b" font-size="11">28/03/2026 11:00</text>
      <text x="230" y="30" fill="#94a3b8" font-size="12" font-weight="600">Mua quà lưu niệm (Ghi nhầm)</text>
      <text x="440" y="30" fill="#64748b" font-size="11">Đảo bút toán hoàn quỹ do sai sót</text>
      <text x="730" y="30" fill="#94a3b8" font-size="13" font-weight="700" text-decoration="line-through">-500.000 đ</text>
      <rect x="840" y="14" width="95" height="24" rx="4" fill="#7f1d1d" />
      <text x="887" y="30" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">REVERSED (ĐẢO)</text>
      <text x="965" y="30" fill="#38bdf8" font-size="11">Xem vết audit</text>
